version: '3.8'

services:
  # The FastAPI Backend
  backend:
    build: .
    container_name: tutor-backend
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./models:/app/models # Mount models directory so we don't have to rebuild docker to update weights

  # The Streamlit Frontend
  frontend:
    build: .
    container_name: tutor-ui
    command: streamlit run src/ui/app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend